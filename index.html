<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <title>Samba Reggae — リズムパターン・メトロノーム</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="head">
        <h1 id="patternName">—</h1>
        <p id="patternMeta" class="meta">—</p>
      </header>

      <section class="stage" aria-label="譜面">
        <div id="score" class="score"></div>
        <p id="status" class="status">停止中</p>
      </section>

      <section class="controls">
        <div class="bpm">
          <output id="bpmValue">120</output>
          <span class="bpmUnit">BPM</span>
        </div>
        <input id="bpm" type="range" min="40" max="240" step="1" value="120" />

        <label class="field">
          <span>音量</span>
          <input id="volume" type="range" min="0" max="100" step="1" value="80" />
        </label>
      </section>

      <button id="play" class="play">再生</button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
