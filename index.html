<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <title>Claves — リズムパターン・メトロノーム</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="head">
        <!-- リズム名がそのまま一覧を開くボタン。1画面レイアウトを崩さない -->
        <button id="patternPicker" class="picker" type="button" aria-haspopup="dialog">
          <span id="patternName">—</span>
          <span class="chev" aria-hidden="true">▾</span>
        </button>
        <p id="patternMeta" class="meta">—</p>
      </header>

      <section class="stage" aria-label="譜面">
        <div id="score" class="score"></div>
      </section>

      <p id="status" class="status">停止中</p>

      <section class="tempo">
        <!-- BPM の表示そのものがタップ面。指で狙う面積が最大になる -->
        <button id="tap" class="bpm" type="button">
          <span class="bpmRow">
            <output id="bpmValue">120</output>
            <span class="bpmUnit">BPM</span>
          </span>
          <span id="tapHint" class="tapHint">タップしてテンポを取る</span>
        </button>
        <input id="bpm" type="range" min="40" max="240" step="1" value="120" aria-label="テンポ" />
      </section>

      <label class="field">
        <span>音量</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="80" />
      </label>

      <button id="play" class="play">再生</button>
    </main>

    <dialog id="patternDialog" class="sheet" aria-label="リズムを選ぶ">
      <ul id="patternList" class="sheetList"></ul>
      <button id="patternClose" class="sheetClose" type="button">閉じる</button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
